name: 生成清单并发布

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 校验 sources/ 并重新生成清单
        run: node scripts/build-manifest.js
       
      - name: 把清单提交回仓库（让 raw 地址也保持最新）
        run: |
          if git diff --quiet -- manifest.json; then
            echo "清单无变化，跳过"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: 自动重新生成清单"
          git push      

      - name: 清单与仓库里提交的不一致（只在 PR 上提醒，不拦合并）
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: node scripts/build-manifest.js --check

      - uses: actions/configure-pages@v5

      - name: 组装发布目录（admin/ 是本机管理工具，不发布）
        run: |
          mkdir -p _site
          cp -r index.html assets sources manifest.json catalog.json .nojekyll _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
